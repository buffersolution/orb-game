<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>轉珠遊戲</title>
<style>
  :root {
    --bg: #14121f;
    --panel: #221f33;
    --text: #f2f0ff;
    --muted: #a39fc0;
    --accent: #ffcf4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #2c2650, var(--bg) 70%);
    color: var(--text);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  #app { width: 100%; max-width: 480px; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; text-align: center; letter-spacing: 2px; }
  .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--panel); border-radius: 10px; padding: 8px; text-align: center; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #timebar { height: 10px; background: var(--panel); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
  #timefill { height: 100%; width: 100%; background: linear-gradient(90deg, #4caf50, #cddc39); transition: background .2s; }
  #timefill.low { background: linear-gradient(90deg, #f44336, #ff9800); }
  #stage { position: relative; display: flex; justify-content: center; }
  canvas { display: block; border-radius: 10px; touch-action: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #result { min-height: 22px; text-align: center; margin: 10px 0; color: var(--muted); font-size: 14px; }
  .controls { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid #3b3660; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; font-family: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle input { width: 16px; height: 16px; accent-color: #9c4dcc; }
  #purpleStatus { width: 100%; text-align: center; font-size: 13px; color: #ce93d8; min-height: 18px; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 14px; }
</style>
</head>
<body>
<div id="app">
  <h1>轉珠遊戲</h1>
  <div class="hud">
    <div class="stat"><div class="label">分數</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">本回合 Combo</div><div class="value" id="curCombo">0</div></div>
    <div class="stat"><div class="label">最高 Combo</div><div class="value" id="bestCombo">0</div></div>
  </div>
  <div id="timebar"><div id="timefill"></div></div>
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="result">按住任一顆珠子開始拖曳</div>
  <div class="controls">
    <button id="reset">重新開局</button>
    <label>轉珠時間
      <select id="timeSel">
        <option value="4">4 秒</option>
        <option value="5" selected>5 秒</option>
        <option value="8">8 秒</option>
        <option value="10">10 秒</option>
      </select>
    </label>
    <label class="toggle"><input type="checkbox" id="purpleMode">蓄珠模式</label>
    <label class="toggle"><input type="checkbox" id="glowMode">超多珠模式</label>
    <div id="purpleStatus"></div>
  </div>
  <p class="hint">
    按住珠子拖曳，經過的珠子會和手上的珠子交換位置（可斜走）。<br>
    第一次交換後開始倒數，放開或時間到就結算。同色橫向或直向連成 3 顆以上即消除，落下的珠子若再相連會形成連鎖 Combo。<br>
    每消除一組 5 顆以上的同色珠，下一次落珠會掉下一顆該顏色的發光珠。<br>
    蓄珠模式：每消除一組紫珠，下一個回合的落珠會額外掉下 2 顆紫珠。<br>
    超多珠模式：每消除一組紫珠，下一次落珠必定先掉下 2 顆紫色發光珠；若該組達 5 顆，另外再照五連規則多掉 1 顆。
  </p>
</div>

<script>
(() => {
  const COLS = 6, ROWS = 5;
  const TYPES = [
    { name: '火', light: '#ffb080', dark: '#e0400e' },
    { name: '水', light: '#81d4fa', dark: '#1565c0' },
    { name: '木', light: '#c5e1a5', dark: '#2e7d32' },
    { name: '光', light: '#fff59d', dark: '#f9a825' },
    { name: '暗', light: '#e1bee7', dark: '#6a1b9a' },
    { name: '心', light: '#ffe0f0', dark: '#f77fc4' },
  ];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const timeFill = document.getElementById('timefill');
  const resultEl = document.getElementById('result');
  const scoreEl = document.getElementById('score');
  const curComboEl = document.getElementById('curCombo');
  const bestComboEl = document.getElementById('bestCombo');
  const timeSel = document.getElementById('timeSel');
  const purpleModeEl = document.getElementById('purpleMode');
  const purpleStatusEl = document.getElementById('purpleStatus');
  const glowModeEl = document.getElementById('glowMode');
  const PURPLE = 4;

  let cell = 64;
  let board = [];          // board[r][c] = orb | null
  let particles = [];
  let state = 'idle';      // idle | drag | resolve
  let held = null;         // { r, c } position of held orb
  let pointer = { x: 0, y: 0 };
  let timerStart = 0, timerRunning = false, moved = false;
  let score = 0, bestCombo = 0;
  let pendingEnhanced = [];  // 下一次落珠要掉下的發光珠顏色
  // 蓄珠模式
  let purpleNext = 0;        // 下一個回合要掉的紫珠數
  let purpleActive = 0;      // 本回合落珠還要掉的紫珠數
  // 超多珠模式
  let pendingPurpleGlow = 0; // 下一次落珠必定先掉的紫色發光珠數

  const rand = n => Math.floor(Math.random() * n);
  const sleep = ms => new Promise(res => setTimeout(res, ms));

  function newOrb(t, r, c) {
    return { t, enhanced: false, x: c, y: r, vy: 0, falling: false, dying: false, scale: 1, alpha: 1 };
  }

  // ---------- 盤面 ----------
  function initBoard() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
      board.push([]);
      for (let c = 0; c < COLS; c++) {
        let t;
        do {
          t = rand(TYPES.length);
        } while (
          (c >= 2 && board[r][c - 1].t === t && board[r][c - 2].t === t) ||
          (r >= 2 && board[r - 1][c].t === t && board[r - 2][c].t === t)
        );
        board[r].push(newOrb(t, r, c));
      }
    }
  }

  function resize() {
    const w = Math.min(stage.clientWidth, 448);
    cell = Math.floor(w / COLS);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = cell * COLS + 'px';
    canvas.style.height = cell * ROWS + 'px';
    canvas.width = cell * COLS * dpr;
    canvas.height = cell * ROWS * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- 音效 ----------
  let audio = null;
  // 管風琴音色：模擬拉桿風琴，以低八度為基音疊加多個泛音
  // 基音 f/2 的第 1、2、3、4、6、8 泛音 = 16'、8'、5⅓'、4'、2⅔'、2' 拉桿
  let organWave = null;
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];
  function beep(combo) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (combo <= 0) return; // 只用來解鎖 AudioContext
      if (!organWave) {
        const real = new Float32Array(9);
        const imag = new Float32Array(9);
        const bars = { 1: 0.5, 2: 1, 3: 0.45, 4: 0.6, 6: 0.3, 8: 0.25 };
        for (const h in bars) imag[h] = bars[h];
        organWave = audio.createPeriodicWave(real, imag);
      }
      // 大調音階往上爬：Combo 1 = C4
      const step = Math.min(combo - 1, 14);
      const semi = Math.floor(step / 7) * 12 + MAJOR[step % 7];
      const freq = 261.63 * Math.pow(2, semi / 12);
      const now = audio.currentTime;
      const dur = 0.45;

      const osc = audio.createOscillator();
      osc.setPeriodicWave(organWave);
      osc.frequency.value = freq / 2;

      // 輕微顫音（旋轉喇叭的感覺）
      const lfo = audio.createOscillator();
      const lfoGain = audio.createGain();
      lfo.frequency.value = 6;
      lfoGain.gain.value = freq * 0.004;
      lfo.connect(lfoGain).connect(osc.frequency);

      // 風琴音量包絡：快速起音、持續、短釋放
      const gain = audio.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.015);
      gain.gain.setValueAtTime(0.12, now + dur - 0.12);
      gain.gain.linearRampToValueAtTime(0, now + dur);

      osc.connect(gain).connect(audio.destination);
      osc.start(now);
      lfo.start(now);
      osc.stop(now + dur);
      lfo.stop(now + dur);
    } catch (e) { /* 無音效也能玩 */ }
  }
  function swapTick() {
    try {
      if (!audio) return;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 900;
      gain.gain.setValueAtTime(0.04, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.05);
      osc.connect(gain).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.05);
    } catch (e) {}
  }

  // ---------- 拖曳轉珠 ----------
  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function cellAt(p) {
    return {
      r: Math.max(0, Math.min(ROWS - 1, Math.floor(p.y / cell))),
      c: Math.max(0, Math.min(COLS - 1, Math.floor(p.x / cell))),
    };
  }

  canvas.addEventListener('pointerdown', e => {
    if (state !== 'idle') return;
    pointer = pointerPos(e);
    if (pointer.x < 0 || pointer.y < 0 || pointer.x >= cell * COLS || pointer.y >= cell * ROWS) return;
    beep(0); // 解鎖 AudioContext（需要使用者手勢）
    held = cellAt(pointer);
    state = 'drag';
    moved = false;
    timerRunning = false;
    canvas.setPointerCapture(e.pointerId);
    resultEl.textContent = '拖曳中…';
  });

  canvas.addEventListener('pointermove', e => {
    if (state !== 'drag') return;
    pointer = pointerPos(e);
    const target = cellAt(pointer);
    // 手指移動太快時，一格一格走過去，路徑上的珠子都要交換
    while (held.r !== target.r || held.c !== target.c) {
      const nr = held.r + Math.sign(target.r - held.r);
      const nc = held.c + Math.sign(target.c - held.c);
      const a = board[held.r][held.c];
      board[held.r][held.c] = board[nr][nc];
      board[nr][nc] = a;
      held = { r: nr, c: nc };
      moved = true;
      swapTick();
      if (!timerRunning) { timerRunning = true; timerStart = performance.now(); }
    }
  });

  function endDrag() {
    if (state !== 'drag') return;
    const orb = board[held.r][held.c];
    // 從手指位置滑回格子
    orb.x = pointer.x / cell - 0.5;
    orb.y = pointer.y / cell - 0.5;
    held = null;
    timerRunning = false;
    if (moved) {
      resolve();
    } else {
      state = 'idle';
      resultEl.textContent = '按住任一顆珠子開始拖曳';
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- 消除判定 ----------
  function findGroups() {
    const mark = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    // 橫向
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        const t = board[r][c].t;
        let e = c;
        while (e + 1 < COLS && board[r][e + 1].t === t) e++;
        if (e - c + 1 >= 3) for (let k = c; k <= e; k++) mark[r][k] = true;
        c = e + 1;
      }
    }
    // 直向
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        const t = board[r][c].t;
        let e = r;
        while (e + 1 < ROWS && board[e + 1][c].t === t) e++;
        if (e - r + 1 >= 3) for (let k = r; k <= e; k++) mark[k][c] = true;
        r = e + 1;
      }
    }
    // 相鄰且同色的標記珠合併成同一組（L、T、十字形都算一組）
    const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    const groups = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      for (let c = 0; c < COLS; c++) {
        if (!mark[r][c] || seen[r][c]) continue;
        const t = board[r][c].t;
        const group = [];
        const queue = [[r, c]];
        seen[r][c] = true;
        while (queue.length) {
          const [cr, cc] = queue.shift();
          group.push([cr, cc]);
          for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nr = cr + dr, nc = cc + dc;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            if (seen[nr][nc] || !mark[nr][nc] || board[nr][nc].t !== t) continue;
            seen[nr][nc] = true;
            queue.push([nr, nc]);
          }
        }
        groups.push(group);
      }
    }
    return groups;
  }

  // ---------- 掉落與補珠 ----------
  function applyGravity() {
    const spawned = [];
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c]) {
          if (r !== write) {
            board[write][c] = board[r][c];
            board[r][c] = null;
            board[write][c].falling = true;
          }
          write--;
        }
      }
      const spawn = write + 1;
      for (let r = write; r >= 0; r--) {
        const orb = newOrb(rand(TYPES.length), r - spawn, c);
        orb.falling = true;
        board[r][c] = orb;
        spawned.push(orb);
      }
    }
    // 置換規則：只挑「原本不是該顏色」的新珠來換；沒得換的累積到下一次落珠
    // 超多珠模式：優先把新珠子換成紫色發光珠
    while (glowModeEl.checked && pendingPurpleGlow > 0) {
      const orb = takeSpawned(spawned, PURPLE);
      if (!orb) break;
      orb.t = PURPLE;
      orb.enhanced = true;
      pendingPurpleGlow--;
    }
    // 五連珠的獎勵：把新珠子換成同色發光珠
    const leftover = [];
    for (const t of pendingEnhanced) {
      const orb = takeSpawned(spawned, t);
      if (!orb) { leftover.push(t); continue; }
      orb.t = t;
      orb.enhanced = true;
    }
    pendingEnhanced = leftover;
    // 蓄珠模式：把剩下的新珠子換成紫珠
    while (purpleModeEl.checked && purpleActive > 0) {
      const orb = takeSpawned(spawned, PURPLE);
      if (!orb) break;
      orb.t = PURPLE;
      purpleActive--;
    }
  }

  // 從新珠清單中隨機取出一顆「不是 t 顏色」的珠子；沒有則回傳 null
  function takeSpawned(spawned, t) {
    const candidates = [];
    spawned.forEach((o, i) => { if (o.t !== t) candidates.push(i); });
    if (!candidates.length) return null;
    return spawned.splice(candidates[rand(candidates.length)], 1)[0];
  }

  function updatePurpleStatus() {
    purpleStatusEl.textContent = purpleModeEl.checked
      ? `下回合額外紫珠 +${purpleNext}`
      : '';
  }

  function settled() {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const o = board[r][c];
        if (o && (o.falling || Math.abs(o.x - c) > 0.02 || Math.abs(o.y - r) > 0.02)) return false;
      }
    return true;
  }
  async function waitSettled() {
    while (!settled()) await sleep(16);
  }

  // ---------- 結算迴圈 ----------
  function burst(r, c, t) {
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1.5 + Math.random() * 3;
      particles.push({
        x: (c + 0.5) * cell, y: (r + 0.5) * cell,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, color: TYPES[t].light,
      });
    }
  }

  async function resolve() {
    state = 'resolve';
    resultEl.textContent = '結算中…';
    curComboEl.textContent = 0;
    purpleActive += purpleNext;
    purpleNext = 0;
    updatePurpleStatus();
    await waitSettled();
    let combo = 0, cleared = 0, gained = 0;
    while (true) {
      const groups = findGroups();
      if (!groups.length) break;
      for (const g of groups) {
        combo++;
        cleared += g.length;
        gained += g.length * 10;
        curComboEl.textContent = combo;
        beep(combo);
        const gt = board[g[0][0]][g[0][1]].t;
        if (g.length >= 5) pendingEnhanced.push(gt);
        if (glowModeEl.checked && gt === PURPLE) pendingPurpleGlow += 2;
        if (purpleModeEl.checked && gt === PURPLE) {
          purpleNext += 2;
          updatePurpleStatus();
        }
        for (const [r, c] of g) {
          board[r][c].dying = true;
          burst(r, c, board[r][c].t);
        }
        await sleep(280);
        for (const [r, c] of g) board[r][c] = null;
      }
      await sleep(100);
      applyGravity();
      await waitSettled();
      await sleep(80);
    }
    if (combo > 0) {
      const mult = 1 + (combo - 1) * 0.25;
      const total = Math.round(gained * mult);
      score += total;
      bestCombo = Math.max(bestCombo, combo);
      scoreEl.textContent = score;
      bestComboEl.textContent = bestCombo;
      resultEl.textContent = `本回合：${combo} Combo／消除 ${cleared} 顆／倍率 ×${mult.toFixed(2)}／+${total} 分`;
    } else {
      resultEl.textContent = '沒有消除任何珠子，再試一次！';
    }
    state = 'idle';
  }

  // ---------- 更新與繪製 ----------
  function update(dt) {
    const limit = Number(timeSel.value) * 1000;
    if (state === 'drag' && timerRunning) {
      const left = Math.max(0, limit - (performance.now() - timerStart));
      timeFill.style.width = (left / limit * 100) + '%';
      timeFill.classList.toggle('low', left < limit * 0.3);
      if (left <= 0) endDrag();
    } else if (state !== 'resolve') {
      timeFill.style.width = '100%';
      timeFill.classList.remove('low');
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const o = board[r][c];
        if (!o) continue;
        if (o.dying) {
          o.scale = Math.max(0, o.scale - dt * 4);
          o.alpha = Math.max(0, o.alpha - dt * 4);
          continue;
        }
        if (o.falling) {
          o.vy += 40 * dt;
          o.y += o.vy * dt;
          if (o.y >= r) { o.y = r; o.vy = 0; o.falling = false; }
          o.x = c;
        } else {
          const k = Math.min(1, dt * 20);
          o.x += (c - o.x) * k;
          o.y += (r - o.y) * k;
          if (Math.abs(o.x - c) < 0.01) o.x = c;
          if (Math.abs(o.y - r) < 0.01) o.y = r;
        }
      }
    }

    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt * 2;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function drawOrb(o, cx, cy, radius, alpha) {
    const type = TYPES[o.t];
    ctx.save();
    ctx.globalAlpha = alpha;
    if (o.enhanced) {
      // 發光珠：外圈脈動光暈
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
      ctx.save();
      const halo = ctx.createRadialGradient(cx, cy, radius * 0.6, cx, cy, radius * (1.25 + pulse * 0.1));
      halo.addColorStop(0, type.light);
      halo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = alpha * (0.55 + pulse * 0.35);
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 1.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.shadowColor = type.light;
      ctx.shadowBlur = radius * (0.5 + pulse * 0.5);
    }
    // 地面陰影
    ctx.save();
    ctx.globalAlpha = alpha * 0.35;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx + radius * 0.08, cy + radius * 0.92, radius * 0.75, radius * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 玻璃本體：中心透亮、邊緣較深
    const body = ctx.createRadialGradient(cx - radius * 0.2, cy - radius * 0.25, radius * 0.05, cx, cy, radius);
    body.addColorStop(0, 'rgba(255,255,255,.95)');
    body.addColorStop(0.35, type.light);
    body.addColorStop(0.85, type.dark);
    body.addColorStop(1, 'rgba(0,0,0,.85)');
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = body;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (o.enhanced) {
      // 發光珠：中央旋轉的四角星芒
      const rot = performance.now() / 900;
      const outer = radius * 0.5, inner = radius * 0.13;
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = rot + i * Math.PI / 4;
        const d = i % 2 === 0 ? outer : inner;
        ctx.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = radius * 0.4;
      ctx.fill();
      ctx.restore();
    }

    // 玻璃邊緣折射暗圈
    const rim = ctx.createRadialGradient(cx, cy, radius * 0.7, cx, cy, radius);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = rim;
    ctx.fill();

    // 底部透光反射（彈珠的焦散亮弧）
    ctx.beginPath();
    ctx.ellipse(cx + radius * 0.1, cy + radius * 0.6, radius * 0.5, radius * 0.22, -0.15, 0, Math.PI * 2);
    const caustic = ctx.createRadialGradient(cx + radius * 0.1, cy + radius * 0.6, 0, cx + radius * 0.1, cy + radius * 0.6, radius * 0.5);
    caustic.addColorStop(0, 'rgba(255,255,255,.45)');
    caustic.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = caustic;
    ctx.fill();

    // 外框
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1, radius * 0.05);
    ctx.strokeStyle = o.enhanced ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.25)';
    ctx.stroke();

    // 鏡面高光
    ctx.beginPath();
    ctx.ellipse(cx - radius * 0.38, cy - radius * 0.45, radius * 0.24, radius * 0.13, -0.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx - radius * 0.12, cy - radius * 0.62, radius * 0.06, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    const W = cell * COLS, H = cell * ROWS;
    ctx.clearRect(0, 0, W, H);
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        ctx.fillStyle = (r + c) % 2 ? '#2a2540' : '#332d4d';
        ctx.fillRect(c * cell, r * cell, cell, cell);
      }

    const radius = cell * 0.44;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const o = board[r][c];
        if (!o) continue;
        if (held && held.r === r && held.c === c) {
          // 手上珠子的殘影
          drawOrb(o, (c + 0.5) * cell, (r + 0.5) * cell, radius, 0.3);
          continue;
        }
        drawOrb(o, (o.x + 0.5) * cell, (o.y + 0.5) * cell, radius * o.scale, o.alpha);
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, cell * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (held) {
      const o = board[held.r][held.c];
      drawOrb(o, pointer.x, pointer.y, radius * 1.1, 0.95);
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('reset').addEventListener('click', () => {
    if (state !== 'idle') return;
    score = 0;
    scoreEl.textContent = 0;
    curComboEl.textContent = 0;
    particles = [];
    pendingEnhanced = [];
    pendingPurpleGlow = 0;
    resetPurple();
    initBoard();
    resultEl.textContent = '按住任一顆珠子開始拖曳';
  });

  function resetPurple() {
    purpleNext = purpleActive = 0;
    updatePurpleStatus();
  }
  purpleModeEl.addEventListener('change', resetPurple);
  glowModeEl.addEventListener('change', () => { pendingPurpleGlow = 0; });

  window.addEventListener('resize', resize);
  resize();
  initBoard();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
